
name: akhmet-anuar-student-api

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: studentuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - student-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studentuser -d studentdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: akhmet-anuar-student-api:v1.0-akhmet-anuar
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/studentdb
      DB_USERNAME: studentuser
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - student-network

volumes:
  postgres_data:

networks:
  student-network:
    driver: bridge
